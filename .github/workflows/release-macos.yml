name: Release macOS app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Prepare an unpublished application draft from main"
        required: true
        type: string
      verify_prepared:
        description: "Only verify the existing draft against its original successful preparation"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  actions: read
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

concurrency:
  group: macos-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepared-draft:
    runs-on: macos-26
    outputs:
      reuse: ${{ steps.prepared.outputs.reuse }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify an existing prepared draft without rebuilding
        id: prepared
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_PREPARED: ${{ inputs.verify_prepared && '1' || '0' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "push" && "$VERIFY_PREPARED" != "1" ]]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "error: prepared draft verification must run from main" >&2
            exit 1
          fi
          prepared_runs="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow release-macos.yml --commit "$GITHUB_SHA" --event workflow_dispatch \
            --limit 20 --json databaseId,conclusion \
            --jq '.[] | select(.conclusion == "success") | .databaseId')"
          prepared_run=""
          for candidate in $prepared_runs; do
            names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts" \
              --jq '.artifacts[] | select(.expired == false) | .name')"
            while IFS= read -r name; do
              if [[ "$name" == "NetVplayer-${RELEASE_VERSION}-release-assets" ]]; then
                prepared_run="$candidate"
                break
              fi
            done <<< "$names"
            if [[ -n "$prepared_run" ]]; then break; fi
          done
          if [[ -z "$prepared_run" ]]; then
            if [[ "$VERIFY_PREPARED" == "1" || -n "$prepared_runs" ]]; then
              echo "error: verification requires a successful original preparation" >&2
              exit 1
            fi
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 script/validate_macos_release_version.py --repo . --tag "$RELEASE_VERSION" \
            --info-plist NetVplayer/Sources/NetVplayerApp/Info.plist
          python3 script/validate_publication_identity.py --history-only --owner spudhero
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 script/audit_provider_public_release.py --repo .
          draft_state="$(gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,author --jq '[.isDraft, .author.login] | @tsv')"
          [[ "$draft_state" == $'true\t'"$GITHUB_REPOSITORY_OWNER" ]]
          python3 - <<'PY'
          import shutil
          if shutil.disk_usage('.').free < 8_000_000_000:
              raise SystemExit('Draft verification requires at least 8 GB available')
          PY
          original="$RUNNER_TEMP/prepared-original"
          draft="$RUNNER_TEMP/prepared-draft"
          gh run download "$prepared_run" --repo "$GITHUB_REPOSITORY" \
            --name "NetVplayer-${RELEASE_VERSION}-release-assets" --dir "$original"
          gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir "$draft"
          (cd "$original" && shasum -a 256 --check SHA256SUMS.txt)
          (cd "$draft" && shasum -a 256 --check SHA256SUMS.txt)
          python3 - "$original" "$draft" "$RELEASE_VERSION" <<'PY'
          import hashlib
          from pathlib import Path
          import sys
          original, draft = map(Path, sys.argv[1:3])
          expected = {f'NetVplayer-{sys.argv[3]}-macos-arm64.zip', 'appcast.xml',
                      'NetVplayer.build-artifacts.json', 'NetVplayer.cdx.json',
                      'NetVplayer.spdx.json', 'SHA256SUMS.txt'}
          for folder in (original, draft):
              if {p.name for p in folder.iterdir()} != expected:
                  raise SystemExit('Prepared asset set differs')
          for name in sorted(expected):
              def digest(path):
                  with path.open('rb') as source:
                      return hashlib.file_digest(source, 'sha256').hexdigest()
              if digest(original / name) != digest(draft / name):
                  raise SystemExit(f'Prepared asset bytes differ: {name}')
          print('Prepared draft matches the successful run for this exact source commit.')
          PY
          echo "reuse=true" >> "$GITHUB_OUTPUT"

  libmpv-runtime:
    needs: prepared-draft
    if: needs.prepared-draft.outputs.reuse != 'true'
    runs-on: macos-26
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify preparation branch and build capacity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "error: draft preparation must run from main" >&2
            exit 1
          fi
          python3 - <<'PY'
          import shutil
          available = shutil.disk_usage('.').free
          print(f'Build volume available bytes: {available}')
          if available < 8_000_000_000:
              raise SystemExit('Build requires at least 8 GB available')
          PY

      - name: Reuse the pinned macOS 14 compatible libmpv runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runtime_root="$RUNNER_TEMP/libmpv-runtime"
          mkdir -p "$runtime_root"
          gh release download 1.1.2 --repo spudhero/NetVplayer \
            --pattern NetVplayer-1.1.2-macos-arm64.zip --dir "$runtime_root"
          printf '%s  %s\n' \
            e03ebba79d6b396f837eca1f93462be69f99f0a3ef58d1f2d0b5ea1592d669fb \
            "$runtime_root/NetVplayer-1.1.2-macos-arm64.zip" | shasum -a 256 --check
          /usr/bin/ditto -x -k "$runtime_root/NetVplayer-1.1.2-macos-arm64.zip" "$runtime_root"
          runtime_bundle="$runtime_root/NetVplayer.app"
          python3 script/validate_macos_compatibility.py \
            --root "$runtime_bundle/Contents/Frameworks" \
            --maximum-version 14.0 \
            --require-mach-o
          python3 script/package_libmpv_runtime_licenses.py \
            --app-bundle "$runtime_bundle" \
            --audit-only
          # Transfer only the audited runtime and its licenses. The app is rebuilt from the tag.
          runtime_only="$runtime_root/runtime-only/NetVplayer.app"
          mkdir -p "$runtime_only/Contents/Frameworks" "$runtime_only/Contents/Resources/ThirdPartyLicenses"
          cp "$runtime_bundle/Contents/Frameworks/"*.dylib "$runtime_only/Contents/Frameworks/"
          cp "$runtime_bundle/Contents/Resources/ThirdPartyLicenses/"libmpv-runtime.{json,md} \
            "$runtime_only/Contents/Resources/ThirdPartyLicenses/"
          /usr/bin/ditto "$runtime_bundle/Contents/Resources/ThirdPartyLicenses/libmpv" \
            "$runtime_only/Contents/Resources/ThirdPartyLicenses/libmpv"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$runtime_only" "$RUNNER_TEMP/libmpv-runtime-macos14-arm64.zip"

      - name: Upload compatible libmpv runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libmpv-runtime-macos14-arm64
          path: ${{ runner.temp }}/libmpv-runtime-macos14-arm64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: libmpv-runtime
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify build volume capacity
        run: |
          python3 - <<'PY'
          import shutil
          available = shutil.disk_usage('.').free
          print(f'Build volume available bytes: {available}')
          if available < 8_000_000_000:
              raise SystemExit('Build requires at least 8 GB available')
          PY

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate TMDB application credential and online metadata
        shell: bash
        env:
          NETVPLAYER_TMDB_READ_ACCESS_TOKEN: ${{ secrets.NETVPLAYER_TMDB_READ_ACCESS_TOKEN }}
          NETVPLAYER_TMDB_API_KEY: ${{ secrets.NETVPLAYER_TMDB_API_KEY }}
        run: python3 script/package_tmdb_credentials.py --validate-only --require --verify-online

      - name: Install Dolby runtime build tools
        run: brew install mpv meson ninja rustup

      - name: Validate release tag and public boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_version="$RELEASE_VERSION"
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: release tag must use MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          app_version="$(plutil -extract CFBundleShortVersionString raw NetVplayer/Sources/NetVplayerApp/Info.plist)"
          if [[ "$app_version" != "$release_version" ]]; then
            echo "error: tag $release_version does not match app version $app_version" >&2
            exit 1
          fi
          git fetch --tags origin
          python3 script/validate_publication_identity.py --history-only --owner spudhero
          python3 script/validate_macos_release_version.py \
            --repo . --tag "$release_version" \
            --info-plist NetVplayer/Sources/NetVplayerApp/Info.plist
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "error: release tag must point to a commit on main" >&2
            exit 1
          fi
          public_gate_deadline=$((SECONDS + 1800))
          while true; do
            public_gate_record="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow provider-public-shell.yml \
              --commit "$GITHUB_SHA" \
              --limit 1 \
              --json status,conclusion \
              --jq '.[0] | [.status, .conclusion] | @tsv')"
            read -r public_gate_status public_gate_conclusion <<< "$public_gate_record"
            if [[ "$public_gate_status" == "completed" && "$public_gate_conclusion" == "success" ]]; then
              break
            fi
            if [[ "$public_gate_status" =~ ^(queued|in_progress|pending|requested|waiting)$ && "$SECONDS" -lt "$public_gate_deadline" ]]; then
              echo "Waiting for the same-commit Provider public shell: $public_gate_status"
              sleep 30
              continue
            fi
            echo "error: Provider public shell must pass for $GITHUB_SHA before release" >&2
            exit 1
          done
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            draft_state="$(gh release view "$release_version" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,author,assets --jq '[.isDraft, .author.login, (.assets | length)] | @tsv')"
            if [[ "$draft_state" != $'true\t'"$GITHUB_REPOSITORY_OWNER"$'\t0' ]]; then
              echo "error: preparation requires the owner's existing empty draft" >&2
              exit 1
            fi
          fi
          python3 script/audit_provider_public_release.py --repo .
          python3 -m unittest -v script/test_macos_release_workflow.py

      - name: Download pinned Sparkle signing tools
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download 2.10.0 --repo sparkle-project/Sparkle \
            --pattern Sparkle-2.10.0.tar.xz --dir "$RUNNER_TEMP"
          echo 'c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  Sparkle-2.10.0.tar.xz' \
            | (cd "$RUNNER_TEMP" && shasum -a 256 --check)
          mkdir -p "$RUNNER_TEMP/sparkle-tools"
          tar -xJf "$RUNNER_TEMP/Sparkle-2.10.0.tar.xz" -C "$RUNNER_TEMP/sparkle-tools"

      - name: Download macOS 14 compatible libmpv runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libmpv-runtime-macos14-arm64
          path: ${{ runner.temp }}/libmpv-runtime-download

      - name: Verify prepared libmpv runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_root="$RUNNER_TEMP/libmpv-runtime-prepared"
          mkdir -p "$runtime_root"
          /usr/bin/ditto -x -k \
            "$RUNNER_TEMP/libmpv-runtime-download/libmpv-runtime-macos14-arm64.zip" \
            "$runtime_root"
          runtime_bundle="$runtime_root/NetVplayer.app"
          python3 script/validate_macos_compatibility.py \
            --root "$runtime_bundle/Contents/Frameworks" \
            --maximum-version 14.0 \
            --require-mach-o
          python3 script/package_libmpv_runtime_licenses.py \
            --app-bundle "$runtime_bundle" \
            --audit-only
          # The downloaded bundle supplies the audited FFmpeg dependency ABI.
          # Rebuild the tagged Dolby overlay before selecting the shipping runtime.
          export PATH="$(brew --prefix rustup)/bin:$PATH"
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-apple-darwin
          dolby_root="$RUNNER_TEMP/netvplayer-dolby-runtime"
          mkdir -p "$dolby_root"
          git clone https://github.com/mpv-player/mpv.git "$dolby_root/mpv"
          git -C "$dolby_root/mpv" checkout 99b4c12cccb4d8d3f72b41944cb6c640e2156650
          git clone https://github.com/haasn/libplacebo.git "$dolby_root/libplacebo"
          git -C "$dolby_root/libplacebo" checkout 0df80ae5229e8e520c0fa4e3d666098a3ffa1cbc
          git -C "$dolby_root/libplacebo" submodule update --init --recursive
          python3 script/build_dolby_runtime.py \
            --base-runtime "$runtime_bundle" \
            --work-dir "$dolby_root/build" \
            --mpv-source "$dolby_root/mpv" \
            --libplacebo-source "$dolby_root/libplacebo"
          runtime_bundle="$dolby_root/build/runtime.app"
          echo "NETVPLAYER_LIBMPV_RUNTIME_BUNDLE=$runtime_bundle" >> "$GITHUB_ENV"

      - name: Build and verify release assets
        id: package
        shell: bash
        env:
          NETVPLAYER_TMDB_READ_ACCESS_TOKEN: ${{ secrets.NETVPLAYER_TMDB_READ_ACCESS_TOKEN }}
          NETVPLAYER_TMDB_API_KEY: ${{ secrets.NETVPLAYER_TMDB_API_KEY }}
          NETVPLAYER_NODE_RUNTIME_CACHE: ${{ runner.temp }}/netvplayer-node-runtime-cache
          NETVPLAYER_NPM_CACHE: ${{ runner.temp }}/netvplayer-npm-cache
          NETVPLAYER_QUICKJS_RUNTIME_CACHE: ${{ runner.temp }}/netvplayer-quickjs-runtime-cache
        run: |
          set -euo pipefail
          release_root="$RUNNER_TEMP/netvplayer-release"
          app_output="$release_root/app"
          asset_output="$release_root/assets"
          extracted_output="$release_root/extracted"
          mkdir -p "$app_output" "$asset_output" "$extracted_output"

          bash NetVplayer/script/build_and_run.sh --package-public "$app_output"

          app_bundle="$app_output/NetVplayer.app"
          archive="$asset_output/NetVplayer-${RELEASE_VERSION}-macos-arm64.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app_bundle" "$archive"
          unzip -t "$archive"
          /usr/bin/ditto -x -k "$archive" "$extracted_output"

          extracted_app="$extracted_output/NetVplayer.app"
          python3 script/package_tmdb_credentials.py --app-bundle "$extracted_app" --audit-only --require
          codesign --verify --deep --strict --verbose=2 "$extracted_app"
          archive_version="$(plutil -extract CFBundleShortVersionString raw "$extracted_app/Contents/Info.plist")"
          if [[ "$archive_version" != "$RELEASE_VERSION" ]]; then
            echo "error: archive version $archive_version does not match tag $RELEASE_VERSION" >&2
            exit 1
          fi
          archive_architectures="$(/usr/bin/lipo -archs "$extracted_app/Contents/MacOS/NetVplayerApp")"
          if [[ "$archive_architectures" != "arm64" ]]; then
            echo "error: expected arm64 release, found $archive_architectures" >&2
            exit 1
          fi
          python3 script/validate_macos_compatibility.py \
            --root "$extracted_app" \
            --maximum-version 14.0 \
            --require-mach-o
          python3 script/audit_source_free_app.py --repo . --app-bundle "$extracted_app"

          build_bin="$(swift build --package-path NetVplayer --configuration release --show-bin-path)"
          python3 script/verify_packaged_app_startup.py \
            --app-bundle "$extracted_app" \
            --build-resources "$build_bin/NetVplayer_NetVplayerApp.bundle" \
            --output "$release_root/startup-smoke"

          cp dist/sbom/NetVplayer.build-artifacts.json "$asset_output/"
          cp dist/sbom/NetVplayer.cdx.json "$asset_output/"
          cp dist/sbom/NetVplayer.spdx.json "$asset_output/"
          echo "asset-output=$asset_output" >> "$GITHUB_OUTPUT"

      - name: Preserve packaged startup acceptance
        if: ${{ !cancelled() && steps.package.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NetVplayer-${{ env.RELEASE_VERSION }}-startup-smoke
          path: ${{ runner.temp }}/netvplayer-release/startup-smoke
          if-no-files-found: error

      - name: Generate matching Sentry debug symbols
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/netvplayer-release/app/NetVplayer.app/Contents/MacOS/NetVplayerApp"
          symbols="$RUNNER_TEMP/netvplayer-release/symbols/NetVplayerApp.dSYM"
          mkdir -p "$(dirname "$symbols")"
          xcrun dsymutil "$binary" -o "$symbols"
          binary_uuid="$(xcrun dwarfdump --uuid "$binary" | awk '{print $2, $3}')"
          symbols_uuid="$(xcrun dwarfdump --uuid "$symbols" | awk '{print $2, $3}')"
          [[ -n "$binary_uuid" && "$binary_uuid" == "$symbols_uuid" ]]

      - name: Upload Sentry symbols when a token is configured
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SENTRY_AUTH_TOKEN" ]]; then
            echo "Sentry upload token is not configured; symbols remain local to this runner."
            exit 0
          fi
          cli="$RUNNER_TEMP/sentry-cli"
          curl --fail --location --silent --show-error \
            https://github.com/getsentry/sentry-cli/releases/download/3.8.0/sentry-cli-Darwin-universal \
            --output "$cli"
          printf '%s  %s\n' \
            2c26914636c47ab9bf9e710484ad7b44d371cbec8bd29cafb36b3cf877bf4285 "$cli" \
            | shasum -a 256 --check
          chmod +x "$cli"
          "$cli" debug-files upload --org spudhero --project apple-macos-e7 \
            --no-sources --wait "$RUNNER_TEMP/netvplayer-release/symbols"

      - name: Sign and validate the update feed
        shell: bash
        working-directory: ${{ steps.package.outputs.asset-output }}
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_ED25519_PRIVATE_KEY" ]]; then
            echo "error: Sparkle signing secret is missing" >&2
            exit 1
          fi
          archive="NetVplayer-${RELEASE_VERSION}-macos-arm64.zip"
          tools="$RUNNER_TEMP/sparkle-tools/bin"
          public_key="$(plutil -extract SUPublicEDKey raw \
            "$RUNNER_TEMP/netvplayer-release/app/NetVplayer.app/Contents/Info.plist")"
          printf '%s\n' "$SPARKLE_ED25519_PRIVATE_KEY" \
            | swift "$GITHUB_WORKSPACE/script/validate_app_update_key.swift" "$public_key"
          printf '%s\n' "$SPARKLE_ED25519_PRIVATE_KEY" \
            | "$tools/generate_appcast" --ed-key-file - \
                --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_VERSION/" \
                --link "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_VERSION" \
                --maximum-deltas 0 --maximum-versions 1 \
                -o appcast.xml .
          printf '%s\n' "$SPARKLE_ED25519_PRIVATE_KEY" \
            | "$tools/sign_update" --verify --ed-key-file - appcast.xml
          signature="$(python3 "$GITHUB_WORKSPACE/script/validate_app_update_feed.py" \
            --feed appcast.xml --archive "$archive" \
            --version "$RELEASE_VERSION" --repository "$GITHUB_REPOSITORY")"
          printf '%s\n' "$SPARKLE_ED25519_PRIVATE_KEY" \
            | "$tools/sign_update" --verify --ed-key-file - "$archive" "$signature"
          (
            shasum -a 256 \
              "$archive" \
              appcast.xml \
              NetVplayer.build-artifacts.json \
              NetVplayer.cdx.json \
              NetVplayer.spdx.json > SHA256SUMS.txt
            shasum -a 256 --check SHA256SUMS.txt
          )

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NetVplayer-${{ env.RELEASE_VERSION }}-release-assets
          path: ${{ steps.package.outputs.asset-output }}
          if-no-files-found: error
          retention-days: 14

      - name: Stage verified GitHub Release draft
        shell: bash
        working-directory: ${{ steps.package.outputs.asset-output }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_version="$RELEASE_VERSION"
          release_assets=(
            "NetVplayer-${release_version}-macos-arm64.zip"
            appcast.xml
            NetVplayer.build-artifacts.json
            NetVplayer.cdx.json
            NetVplayer.spdx.json
            SHA256SUMS.txt
          )
          if gh release view "$release_version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_state="$(gh release view "$release_version" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,assets --jq 'if .isDraft and (.assets | length) == 0 then "empty-draft" else "existing" end')"
            if [[ "$release_state" == "empty-draft" ]]; then
              draft_author="$(gh release view "$release_version" --repo "$GITHUB_REPOSITORY" --json author --jq '.author.login')"
              if [[ "$draft_author" != "$GITHUB_REPOSITORY_OWNER" ]]; then
                echo "error: empty draft must be created by the repository owner" >&2
                exit 1
              fi
              gh release upload "$release_version" "${release_assets[@]}" --repo "$GITHUB_REPOSITORY"
              echo "Verified assets staged in the owner's unpublished draft."
              exit 0
            fi
            existing_assets="$RUNNER_TEMP/existing-release"
            mkdir -p "$existing_assets"
            gh release download "$release_version" --repo "$GITHUB_REPOSITORY" \
              --dir "$existing_assets"
            (
              cd "$existing_assets"
              shasum -a 256 --check SHA256SUMS.txt
            )
            cmp SHA256SUMS.txt "$existing_assets/SHA256SUMS.txt"
            echo "Existing release assets match; the release is preserved."
          else
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "error: preparation cannot create a release tag" >&2
              exit 1
            fi
            gh release create "$release_version" "${release_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --fail-on-no-commits \
              --title "NetVplayer $release_version" \
              --notes-file "$GITHUB_WORKSPACE/docs/releases/${release_version}.md" \
