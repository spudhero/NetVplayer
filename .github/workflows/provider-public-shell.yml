name: Provider public shell

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner (26 is the current available ARM64 pool)"
        required: false
        default: macos-26
        type: choice
        options:
          - macos-15
          - macos-26
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "ARCHITECTURE.md"
      - "docs/guide.md"
      - "docs/overview-screenshots.json"
      - "CONTRIBUTING.md"
      - "docs/releases/**"
      - "script/runtime/README.md"
      - "script/audit_provider_public_boundary.py"
      - "script/test_audit_provider_public_boundary.py"
      - "provider-runners/**"
      - "provider-sdk/**"
      - "android-presentation/**"
      - "docs/data/provider-public-boundary-v1.json"
      - "docs/data/torrent-bridge-license-audit-2026-08-18.json"
      - "NetVplayer/Package.swift"
      - "NetVplayer/Resources/TorrentBridge/**"
      - "NetVplayer/Sources/**"
      - "NetVplayer/Tests/**"
      - "script/build_provider_distribution_index.py"
      - "script/build_provider_package.py"
      - "script/build_provider_sandbox_launcher.py"
      - "script/audit_provider_public_release.py"
      - "script/public_release_policy.py"
      - "script/android_presentation.py"
      - "script/android_compatibility.py"
      - "script/test_android_compatibility.py"
      - "script/audit_public_links.py"
      - "script/test_android_presentation_audit.py"
      - "script/test_audit_public_links.py"
      - "script/build_android_dialog_presentation.py"
      - "script/fixtures/web-transport/**"
      - "script/audit_source_free_app.py"
      - "script/test_audit_source_free_app.py"
      - "NetVplayer/script/build_and_run.sh"
      - "script/export_provider_public_shell.py"
      - "script/package_libmpv_runtime_licenses.py"
      - "script/package_file_transfer.py"
      - "script/prepare_file_transfer_runtime.py"
      - "script/package_sentry_resources.py"
      - "script/test_package_sentry_resources.py"
      - "script/package_tmdb_credentials.py"
      - "script/test_package_tmdb_credentials.py"
      - "script/prepare_embedded_quickjs_runtime.py"
      - "script/audit_torrent_bridge_licenses.py"
      - "script/apply_torrent_bridge_replacements.py"
      - "script/test_audit_provider_public_release.py"
      - "script/test_audit_torrent_bridge_licenses.py"
      - "script/test_apply_torrent_bridge_replacements.py"
      - "script/test_macos_release_workflow.py"
      - "script/verify_packaged_app_startup.py"
      - "script/test_packaged_app_startup.py"
      - "script/verify_app_termination.py"
      - "script/fixtures/application_termination.swift"
      - "script/test_app_update_release.py"
      - "script/validate_app_update_feed.py"
      - "script/validate_macos_release_version.py"
      - "script/validate_app_update_key.swift"
      - "script/test_package_libmpv_runtime_licenses.py"
      - "script/test_prepare_embedded_quickjs_runtime.py"
      - "script/test_provider_public_shell.py"
      - "script/run_swift_regression.py"
      - "script/test_run_swift_regression.py"
      - "script/test_provider_*.py"
      - "script/validate_provider_*.py"
      - "script/validate_*_runtime.py"
      - ".github/workflows/provider-public-shell.yml"
      - ".github/workflows/release-macos.yml"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

jobs:
  public-shell:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify build volume capacity
        run: |
          python3 - <<'PY'
          import shutil
          available = shutil.disk_usage('.').free
          print(f'Build volume available bytes: {available}')
          if available < 8_000_000_000:
              raise SystemExit('Build requires at least 8 GB available')
          PY

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify native asynchronous application termination
        run: python3 script/verify_app_termination.py --output "$RUNNER_TEMP/application-termination"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.20.0"

      - name: Verify WebKit fixture delegate dispatch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile
          source = Path('NetVplayer/Tests/ConfigEngineTests/WebCookieSeedScopeTests.swift').read_text()
          start = source.index('@MainActor\nclass SeedBrowser:')
          end = source.index('\n@MainActor\nfinal class SeedScopeFixture', start)
          delegate_source = 'import Foundation\nimport WebKit\nimport Security\n' + source[start:end]
          probe = '''
          import Foundation
          import WebKit
          @MainActor private final class DelegateSubclass: SeedBrowser {}
          @main struct DelegateProbe {
              @MainActor static func main() {
                  let selector = NSSelectorFromString("webView:didReceiveAuthenticationChallenge:completionHandler:")
                  let delegates: [SeedBrowser] = [SeedBrowser(certificate: Data()), DelegateSubclass(certificate: Data())]
                  for delegate in delegates {
                      precondition(delegate.responds(to: selector), "WebKit authentication selector missing")
                  }
                  print("WebKit authentication selector is implemented and inherited")
              }
          }
          '''
          with tempfile.TemporaryDirectory(prefix='webkit-delegate-') as directory:
              source = Path(directory) / 'Delegate.swift'
              main = Path(directory) / 'Main.swift'
              binary = Path(directory) / 'delegate-probe'
              source.write_text(delegate_source)
              main.write_text(probe)
              subprocess.run(['swiftc', '-parse-as-library', '-strict-concurrency=complete',
                              '-warnings-as-errors', str(source), str(main), '-o', str(binary)], check=True)
              subprocess.run([str(binary)], check=True)
          PY

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Use OpenSSL 3 for Ed25519 fixtures
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      - name: Install playback and file transfer development files
        run: |
          brew install mpv libssh2
          echo "NETVPLAYER_FILE_TRANSFER_RUNTIME=$(brew --prefix libssh2)" >> "$GITHUB_ENV"

      - name: Fetch pinned Java fixture dependency
        shell: bash
        run: |
          set -euo pipefail
          gson="$RUNNER_TEMP/gson-2.11.0.jar"
          curl --fail --location --silent --show-error \
            https://repo1.maven.org/maven2/com/google/code/gson/gson/2.11.0/gson-2.11.0.jar \
            --output "$gson"
          printf '%s  %s\n' \
            57928d6e5a6edeb2abd3770a8f95ba44dce45f3b23b7a9dc2b309c581552a78b \
            "$gson" | shasum -a 256 --check
          echo "NETVPLAYER_GSON_JAR=$gson" >> "$GITHUB_ENV"

      - name: Install and audit WebTorrent runtime dependencies
        env:
          npm_config_cache: ${{ runner.temp }}/netvplayer-npm-cache
        run: |
          npm ci \
            --prefix NetVplayer/Resources/TorrentBridge \
            --omit=dev \
            --no-audit \
            --no-fund
          python3 script/apply_torrent_bridge_replacements.py \
            --root NetVplayer/Resources/TorrentBridge
          python3 script/audit_torrent_bridge_licenses.py \
            --check docs/data/torrent-bridge-license-audit-2026-08-18.json

      - name: Run public Provider gate
        run: python3 script/test_provider_public_shell.py --gson-jar "$NETVPLAYER_GSON_JAR"

      - name: Verify the CI regression runner
        run: python3 -m unittest script/test_run_swift_regression.py

      # Fail early on the WebKit diagnostic contract before the complete suite.
      # SwiftPM reuses this build for the complete regression below.
      - name: Verify WebKit rule diagnostic ordering
        run: >-
          swift test --package-path NetVplayer --disable-sandbox --no-parallel
          --filter diagnosticsHashRuleScriptsAndRecordRejectedChecks

      - name: Run serial SwiftPM regression
        run: >-
          python3 script/run_swift_regression.py --require-summary --
          swift test --package-path NetVplayer --disable-sandbox --no-parallel

      - name: Verify signed sandbox home isolation
        env:
          NETVPLAYER_RUN_SIGNED_SANDBOX_HOME_TEST: "1"
        run: >-
          swift test --package-path NetVplayer --skip-build --disable-sandbox --no-parallel
          --filter signedSandboxAuditExecutesHomeWithoutReadingOrChangingOrdinaryState

      - name: Check patch formatting
        run: git diff --check
